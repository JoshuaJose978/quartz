<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold" fill="#333333">Resource Usage Comparison: Single Machine</text>
  
  <!-- Docker Side -->
  <rect x="50" y="70" width="300" height="380" rx="10" fill="#f5f5f5" stroke="#dddddd" stroke-width="2"/>
  <text x="200" y="100" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#2496ED">Docker</text>
  
  <!-- Application Containers -->
  <rect x="80" y="130" width="240" height="40" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="200" y="155" font-family="Arial" font-size="16" text-anchor="middle" fill="white">Application Container 1</text>
  
  <rect x="80" y="180" width="240" height="40" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="200" y="205" font-family="Arial" font-size="16" text-anchor="middle" fill="white">Application Container 2</text>
  
  <rect x="80" y="230" width="240" height="40" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="200" y="255" font-family="Arial" font-size="16" text-anchor="middle" fill="white">Application Container 3</text>
  
  <!-- Docker Engine -->
  <rect x="80" y="300" width="240" height="60" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="200" y="335" font-family="Arial" font-size="16" text-anchor="middle" fill="white">Docker Engine</text>
  
  <!-- Host OS -->
  <rect x="80" y="370" width="240" height="40" rx="5" fill="#A9A9A9" stroke="#7A7A7A" stroke-width="2"/>
  <text x="200" y="395" font-family="Arial" font-size="16" text-anchor="middle" fill="white">Host OS</text>
  
  <!-- Resource Usage Metrics -->
  <text x="200" y="440" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Lower Resource Overhead</text>
  
  <!-- Kubernetes Side -->
  <rect x="450" y="70" width="300" height="380" rx="10" fill="#f5f5f5" stroke="#dddddd" stroke-width="2"/>
  <text x="600" y="100" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#326CE5">Kubernetes (Single Node)</text>
  
  <!-- Application Containers -->
  <rect x="480" y="130" width="240" height="40" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="600" y="155" font-family="Arial" font-size="16" text-anchor="middle" fill="white">Application Container 1</text>
  
  <rect x="480" y="180" width="240" height="40" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="600" y="205" font-family="Arial" font-size="16" text-anchor="middle" fill="white">Application Container 2</text>
  
  <rect x="480" y="230" width="240" height="40" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="600" y="255" font-family="Arial" font-size="16" text-anchor="middle" fill="white">Application Container 3</text>
  
  <!-- K8s Components -->
  <rect x="480" y="280" width="70" height="30" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="515" y="300" font-family="Arial" font-size="10" text-anchor="middle" fill="white">API Server</text>
  
  <rect x="560" y="280" width="70" height="30" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="595" y="300" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Scheduler</text>
  
  <rect x="640" y="280" width="70" height="30" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="675" y="300" font-family="Arial" font-size="10" text-anchor="middle" fill="white">Controller</text>
  
  <rect x="480" y="320" width="70" height="30" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="515" y="340" font-family="Arial" font-size="10" text-anchor="middle" fill="white">etcd</text>
  
  <rect x="560" y="320" width="70" height="30" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="595" y="340" font-family="Arial" font-size="10" text-anchor="middle" fill="white">kubelet</text>
  
  <rect x="640" y="320" width="70" height="30" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="675" y="340" font-family="Arial" font-size="10" text-anchor="middle" fill="white">kube-proxy</text>
  
  <!-- Container Runtime -->
  <rect x="480" y="360" width="240" height="30" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="600" y="380" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Container Runtime</text>
  
  <!-- Host OS -->
  <rect x="480" y="400" width="240" height="30" rx="5" fill="#A9A9A9" stroke="#7A7A7A" stroke-width="2"/>
  <text x="600" y="420" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Host OS</text>
  
  <!-- Resource Usage Metrics -->
  <text x="600" y="440" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Higher Resource Overhead</text>
  
  <!-- Comparison Arrow -->
  <path d="M 370 250 L 430 250" stroke="#333333" stroke-width="2"/>
  <polygon points="430,250 420,245 420,255" fill="#333333"/>
</svg>