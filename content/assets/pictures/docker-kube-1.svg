<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Docker Section -->
  <rect x="50" y="50" width="300" height="400" rx="10" fill="#f5f5f5" stroke="#dddddd" stroke-width="2"/>
  <text x="200" y="90" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold" fill="#2496ED">Docker</text>
  
  <!-- Docker Container Images -->
  <rect x="100" y="120" width="80" height="60" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="140" y="155" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Container 1</text>
  
  <rect x="100" y="200" width="80" height="60" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="140" y="235" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Container 2</text>
  
  <rect x="100" y="280" width="80" height="60" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="140" y="315" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Container 3</text>
  
  <!-- Docker Engine -->
  <rect x="100" y="360" width="200" height="40" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="200" y="385" font-family="Arial" font-size="16" text-anchor="middle" fill="white">Docker Engine</text>
  
  <!-- Host OS -->
  <rect x="80" y="410" width="240" height="30" rx="5" fill="#A9A9A9" stroke="#7A7A7A" stroke-width="2"/>
  <text x="200" y="430" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Host OS</text>
  
  <!-- Kubernetes Section -->
  <rect x="450" y="50" width="300" height="400" rx="10" fill="#f5f5f5" stroke="#dddddd" stroke-width="2"/>
  <text x="600" y="90" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold" fill="#326CE5">Kubernetes</text>
  
  <!-- Kubernetes Pods -->
  <rect x="525" y="120" width="150" height="120" rx="5" fill="#D1E3FF" stroke="#A0C4FF" stroke-width="2"/>
  <text x="600" y="140" font-family="Arial" font-size="14" text-anchor="middle" fill="#326CE5">Pod</text>
  
  <rect x="540" y="155" width="50" height="40" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="565" y="180" font-family="Arial" font-size="10" text-anchor="middle" fill="white">C1</text>
  
  <rect x="610" y="155" width="50" height="40" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="635" y="180" font-family="Arial" font-size="10" text-anchor="middle" fill="white">C2</text>
  
  <!-- Kubernetes Components -->
  <rect x="480" y="260" width="100" height="40" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="530" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="white">API Server</text>
  
  <rect x="600" y="260" width="100" height="40" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="650" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Controller</text>
  
  <rect x="480" y="320" width="100" height="40" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="530" y="345" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Scheduler</text>
  
  <rect x="600" y="320" width="100" height="40" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="650" y="345" font-family="Arial" font-size="12" text-anchor="middle" fill="white">etcd</text>
  
  <!-- Kubernetes Nodes -->
  <rect x="480" y="380" width="220" height="40" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="590" y="405" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Worker Node(s) with kubelet</text>
  
  <!-- Connection between them -->
  <path d="M 350 225 L 450 225" stroke="#333333" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="400" y="210" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Orchestrates</text>
  <polygon points="445,225 435,220 435,230" fill="#333333"/>
</svg>