<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold" fill="#333333">Complexity vs. Features Spectrum</text>
  
  <!-- Spectrum Line -->
  <line x1="100" y1="200" x2="700" y2="200" stroke="#333333" stroke-width="4"/>
  
  <!-- Tick Marks -->
  <line x1="100" y1="195" x2="100" y2="205" stroke="#333333" stroke-width="2"/>
  <line x1="300" y1="195" x2="300" y2="205" stroke="#333333" stroke-width="2"/>
  <line x1="500" y1="195" x2="500" y2="205" stroke="#333333" stroke-width="2"/>
  <line x1="700" y1="195" x2="700" y2="205" stroke="#333333" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="100" y="230" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#2496ED">Docker</text>
  <text x="100" y="250" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Simple container</text>
  <text x="100" y="270" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">management</text>
  
  <text x="300" y="230" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#2496ED">Docker Compose</text>
  <text x="300" y="250" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Multi-container</text>
  <text x="300" y="270" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">applications</text>
  
  <text x="500" y="230" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#326CE5">Minikube/Kind</text>
  <text x="500" y="250" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Local K8s</text>
  <text x="500" y="270" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">development</text>
  
  <text x="700" y="230" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#326CE5">Kubernetes</text>
  <text x="700" y="250" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">Full cluster</text>
  <text x="700" y="270" font-family="Arial" font-size="14" text-anchor="middle" fill="#333333">orchestration</text>
  
  <!-- Feature Axis -->
  <text x="400" y="320" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#333333">Features →</text>
  
  <!-- Complexity Axis -->
  <text x="400" y="170" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#333333">Complexity →</text>
  
  <!-- Performance Bar -->
  <rect x="100" y="100" width="600" height="25" rx="5" fill="#f5f5f5" stroke="#dddddd" stroke-width="2"/>
  <rect x="100" y="100" width="600" height="25" rx="5" fill="url(#performance-gradient)"/>
  <text x="400" y="118" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Performance on Single Machine</text>
  
  <!-- Performance Labels -->
  <text x="100" y="90" font-family="Arial" font-size="14" text-anchor="start" fill="#333333">Higher</text>
  <text x="700" y="90" font-family="Arial" font-size="14" text-anchor="end" fill="#333333">Lower</text>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="performance-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FFC107;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F44336;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icons -->
  <circle cx="100" cy="200" r="15" fill="#2496ED"/>
  <circle cx="300" cy="200" r="15" fill="#2496ED"/>
  <circle cx="500" cy="200" r="15" fill="#326CE5"/>
  <circle cx="700" cy="200" r="15" fill="#326CE5"/>
</svg>