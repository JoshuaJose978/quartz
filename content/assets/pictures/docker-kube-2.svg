<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold" fill="#333333">Kubernetes Cluster Architecture</text>
  
  <!-- Control Plane -->
  <rect x="50" y="70" width="700" height="200" rx="10" fill="#E6F3FF" stroke="#BFD9FF" stroke-width="2"/>
  <text x="400" y="95" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#326CE5">Control Plane</text>
  
  <!-- Control Plane Components -->
  <rect x="80" y="120" width="140" height="50" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="150" y="152" font-family="Arial" font-size="14" text-anchor="middle" fill="white">API Server</text>
  
  <rect x="240" y="120" width="140" height="50" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="310" y="152" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Scheduler</text>
  
  <rect x="400" y="120" width="140" height="50" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="470" y="152" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Controller Manager</text>
  
  <rect x="560" y="120" width="140" height="50" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="630" y="152" font-family="Arial" font-size="14" text-anchor="middle" fill="white">etcd</text>
  
  <text x="400" y="200" font-family="Arial" font-size="14" text-anchor="middle" fill="#326CE5">Manages cluster state, scheduling, and orchestration</text>
  
  <!-- Worker Nodes -->
  <rect x="50" y="300" width="220" height="250" rx="10" fill="#F0F5FF" stroke="#D0E0FF" stroke-width="2"/>
  <text x="160" y="325" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#326CE5">Worker Node 1</text>
  
  <rect x="290" y="300" width="220" height="250" rx="10" fill="#F0F5FF" stroke="#D0E0FF" stroke-width="2"/>
  <text x="400" y="325" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#326CE5">Worker Node 2</text>
  
  <rect x="530" y="300" width="220" height="250" rx="10" fill="#F0F5FF" stroke="#D0E0FF" stroke-width="2"/>
  <text x="640" y="325" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#326CE5">Worker Node 3</text>
  
  <!-- Node Components -->
  <!-- Node 1 -->
  <rect x="70" y="350" width="180" height="40" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="160" y="375" font-family="Arial" font-size="14" text-anchor="middle" fill="white">kubelet</text>
  
  <rect x="70" y="400" width="180" height="40" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="160" y="425" font-family="Arial" font-size="14" text-anchor="middle" fill="white">kube-proxy</text>
  
  <rect x="80" y="450" width="70" height="70" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="115" y="490" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Pod 1</text>
  
  <rect x="170" y="450" width="70" height="70" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="205" y="490" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Pod 2</text>
  
  <!-- Node 2 -->
  <rect x="310" y="350" width="180" height="40" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="400" y="375" font-family="Arial" font-size="14" text-anchor="middle" fill="white">kubelet</text>
  
  <rect x="310" y="400" width="180" height="40" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="400" y="425" font-family="Arial" font-size="14" text-anchor="middle" fill="white">kube-proxy</text>
  
  <rect x="320" y="450" width="70" height="70" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="355" y="490" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Pod 3</text>
  
  <rect x="410" y="450" width="70" height="70" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="445" y="490" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Pod 4</text>
  
  <!-- Node 3 -->
  <rect x="550" y="350" width="180" height="40" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="640" y="375" font-family="Arial" font-size="14" text-anchor="middle" fill="white">kubelet</text>
  
  <rect x="550" y="400" width="180" height="40" rx="5" fill="#326CE5" stroke="#2254ab" stroke-width="2"/>
  <text x="640" y="425" font-family="Arial" font-size="14" text-anchor="middle" fill="white">kube-proxy</text>
  
  <rect x="560" y="450" width="70" height="70" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="595" y="490" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Pod 5</text>
  
  <rect x="650" y="450" width="70" height="70" rx="5" fill="#2496ED" stroke="#1d81ce" stroke-width="2"/>
  <text x="685" y="490" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Pod 6</text>
  
  <!-- Connections -->
  <path d="M 400 270 L 400 300" stroke="#326CE5" stroke-width="2"/>
  <path d="M 300 200 L 160 300" stroke="#326CE5" stroke-width="2"/>
  <path d="M 500 200 L 640 300" stroke="#326CE5" stroke-width="2"/>
  
  <!-- Labels -->
  <text x="400" y="580" font-family="Arial" font-size="16" text-anchor="middle" fill="#333333">Kubernetes distributes workloads across multiple nodes</text>
</svg>